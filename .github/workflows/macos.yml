# Builds the macOS app for a release and attaches it to that release.
#
# `npm run release` runs on Windows, which can't build the Mac app, so this
# runs as soon as the release is published: it builds the universal
# (Apple silicon + Intel) app from the release's tag and uploads
#   Paraphe-<version>-macos.zip   for that version
#   Paraphe-macos.zip             the same file, for the site's `latest` link
# `npm run release` waits for it before it deploys the site.
#
# Actions are pinned to commit SHAs, npm installs from the lockfile with no
# install scripts (.npmrc), and only the upload step gets the token.
name: macOS app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to build for, such as v1.3.5
        required: true

permissions: {}

jobs:
  build:
    name: Build and attach the macOS app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: macos-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "v$version" != "$TAG" ]]; then
            echo "package.json says $version, the tag is $TAG" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install (lockfile only, no install scripts)
        run: npm ci

      - name: Build the app
        run: npm run build:app-macos

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/Paraphe-$VERSION-macos.zip" dist/Paraphe-macos.zip
          gh release upload "$TAG" "dist/Paraphe-$VERSION-macos.zip" dist/Paraphe-macos.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
